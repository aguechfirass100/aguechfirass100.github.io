<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="presto-title presto-desc">
  <title id="presto-title">Presto retrieval pipeline overview</title>
  <desc id="presto-desc">Five-stage Arabic retrieval pipeline: normalize, retrieve with dense and BM25, fuse with DBSF, rerank with ColBERT MaxSim, and submit top 10. Final leaderboard score 0.62773 nDCG at 10, ranked eleventh of more than fifty teams.</desc>
  <defs>
    <marker id="presto-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8d1f2d"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="#f3efe7"/>
  <rect width="12" height="630" fill="#8d1f2d"/>
  <text x="54" y="58" font-family="'DejaVu Sans Mono','SFMono-Regular',Consolas,monospace" font-size="13" letter-spacing="2.4" fill="#8d1f2d">PRESTO / ARABIC RETRIEVAL</text>
  <text x="1146" y="58" text-anchor="end" font-family="'DejaVu Sans Mono','SFMono-Regular',Consolas,monospace" font-size="12" letter-spacing="1.8" fill="#625b54">CASE STUDY</text>
  <text x="54" y="144" font-family="Georgia,'Times New Roman',serif" font-size="49" font-weight="700" fill="#1d1a17">Search where exact matches are rare.</text>
  <text x="54" y="184" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#625b54">29,014 queries · 107,041 products · 90.8% had no exact catalogue match</text>

  <g font-family="Arial,Helvetica,sans-serif">
    <rect x="52" y="230" width="200" height="150" rx="8" fill="#ffffff" stroke="#d9d2c7"/>
    <text x="70" y="258" font-family="'DejaVu Sans Mono','SFMono-Regular',Consolas,monospace" font-size="10" letter-spacing="1.2" fill="#8d1f2d">01 / NORMALIZE</text>
    <text x="70" y="288" font-size="18" font-weight="700" fill="#1d1a17">Arabic query</text>
    <text x="70" y="315" font-size="13" fill="#625b54">alef / yaa / taa</text>
    <text x="70" y="336" font-size="13" fill="#625b54">diacritics + digits</text>
    <text x="70" y="357" font-size="13" fill="#625b54">shared query/index code</text>

    <rect x="280" y="230" width="200" height="150" rx="8" fill="#ffffff" stroke="#d9d2c7"/>
    <text x="298" y="258" font-family="'DejaVu Sans Mono','SFMono-Regular',Consolas,monospace" font-size="10" letter-spacing="1.2" fill="#8d1f2d">02 / RETRIEVE</text>
    <text x="298" y="288" font-size="18" font-weight="700" fill="#1d1a17">Dense + BM25</text>
    <text x="298" y="315" font-size="13" fill="#625b54">Qwen3 + LoRA</text>
    <text x="298" y="336" font-size="13" fill="#625b54">lexical baseline</text>
    <text x="298" y="357" font-size="13" fill="#625b54">two recall paths</text>

    <rect x="508" y="230" width="200" height="150" rx="8" fill="#ffffff" stroke="#d9d2c7"/>
    <text x="526" y="258" font-family="'DejaVu Sans Mono','SFMono-Regular',Consolas,monospace" font-size="10" letter-spacing="1.2" fill="#8d1f2d">03 / FUSE</text>
    <text x="526" y="288" font-size="18" font-weight="700" fill="#1d1a17">DBSF</text>
    <text x="526" y="315" font-size="13" fill="#625b54">top-5,000 pool</text>
    <text x="526" y="336" font-size="13" fill="#625b54">rank-based fusion</text>
    <text x="526" y="357" font-size="13" fill="#625b54">benchmarked vs RRF</text>

    <rect x="736" y="230" width="200" height="150" rx="8" fill="#ffffff" stroke="#d9d2c7"/>
    <text x="754" y="258" font-family="'DejaVu Sans Mono','SFMono-Regular',Consolas,monospace" font-size="10" letter-spacing="1.2" fill="#8d1f2d">04 / RERANK</text>
    <text x="754" y="288" font-size="18" font-weight="700" fill="#1d1a17">ColBERT</text>
    <text x="754" y="315" font-size="13" fill="#625b54">token-level MaxSim</text>
    <text x="754" y="336" font-size="13" fill="#625b54">chunked einsum</text>
    <text x="754" y="357" font-size="13" fill="#625b54">cached catalogue</text>

    <rect x="964" y="230" width="184" height="150" rx="8" fill="#f4e6e5" stroke="#8d1f2d"/>
    <text x="982" y="258" font-family="'DejaVu Sans Mono','SFMono-Regular',Consolas,monospace" font-size="10" letter-spacing="1.2" fill="#8d1f2d">05 / SUBMIT</text>
    <text x="982" y="288" font-size="18" font-weight="700" fill="#1d1a17">Top-10</text>
    <text x="982" y="315" font-size="13" fill="#625b54">product IDs</text>
    <text x="982" y="336" font-size="13" fill="#625b54">graded nDCG</text>
    <text x="982" y="357" font-size="13" fill="#625b54">one CSV</text>
  </g>

  <g stroke="#8d1f2d" stroke-width="1.8">
    <line x1="252" y1="305" x2="276" y2="305" marker-end="url(#presto-arrow)"/>
    <line x1="480" y1="305" x2="504" y2="305" marker-end="url(#presto-arrow)"/>
    <line x1="708" y1="305" x2="732" y2="305" marker-end="url(#presto-arrow)"/>
    <line x1="936" y1="305" x2="960" y2="305" marker-end="url(#presto-arrow)"/>
  </g>

  <rect x="52" y="430" width="1096" height="132" rx="8" fill="#ffffff" stroke="#d9d2c7"/>
  <text x="74" y="462" font-family="'DejaVu Sans Mono','SFMono-Regular',Consolas,monospace" font-size="11" letter-spacing="1.5" fill="#625b54">FINAL LEADERBOARD</text>
  <text x="74" y="526" font-family="Georgia,'Times New Roman',serif" font-size="51" font-weight="700" fill="#8d1f2d">0.62773</text>
  <text x="300" y="524" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#625b54">nDCG@10</text>
  <text x="1124" y="466" text-anchor="end" font-family="'DejaVu Sans Mono','SFMono-Regular',Consolas,monospace" font-size="11" letter-spacing="1.5" fill="#625b54">FINAL RANK</text>
  <text x="1124" y="526" text-anchor="end" font-family="Georgia,'Times New Roman',serif" font-size="42" font-weight="700" fill="#1d1a17">11th / 50+</text>

  <text x="54" y="600" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#625b54">Diagram drawn from the implementation notes. Source code and competition data are not public; this case study is based on preserved experiment records.</text>
</svg>
