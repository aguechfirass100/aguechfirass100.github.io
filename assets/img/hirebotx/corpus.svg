<text x="48" y="742" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="17" fill="#0f172a" font-weight="700">Retrieval path</text>
<text x="48" y="770" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13.5" fill="#0f172a">query text → MiniLM encode (384-d) → Chroma top-k × 5 → Python filter: category prefix, difficulty, owner → at most 5 results</text>
<text x="48" y="798" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="12.5" fill="#b45309">Not hybrid search: there is no BM25 lane. “Hybrid” in the README means vector recall plus post-retrieval metadata filtering.</text>
<text x="48" y="820" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="12.5" fill="#5b6b7c">The retriever is a process-wide singleton so the embedding model loads once — not once per tool call.</text>
<text x="48" y="858" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="12" fill="#5b6b7c">Counts read directly from mock_interview/chroma_db/chroma.sqlite3 · 752 embeddings · 384-d vectors · metadata distribution from embedding_metadata.</text>
