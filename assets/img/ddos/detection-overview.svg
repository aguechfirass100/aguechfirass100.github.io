<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="ddos-title ddos-desc">
  <title id="ddos-title">Transformer-based DDoS detection overview</title>
  <desc id="ddos-desc">Flow records pass through transformer variants to a twelve-class output. A class-aware evaluation reports 95.26 percent accuracy and 0.95 macro F1, with a highlighted 0.65 recall for NetBIOS.</desc>
  <defs>
    <marker id="ddos-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8d1f2d"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="#f3efe7"/>
  <rect width="12" height="630" fill="#8d1f2d"/>
  <text x="54" y="58" font-family="'DejaVu Sans Mono','SFMono-Regular',Consolas,monospace" font-size="13" letter-spacing="2.2" fill="#8d1f2d">TRANSFORMER-BASED DDoS DETECTION</text>
  <text x="1146" y="58" text-anchor="end" font-family="'DejaVu Sans Mono','SFMono-Regular',Consolas,monospace" font-size="12" letter-spacing="1.8" fill="#625b54">RESEARCH</text>
  <text x="54" y="144" font-family="Georgia,'Times New Roman',serif" font-style="normal" font-size="49" font-weight="700" fill="#1d1a17">Accuracy alone hides weak classes.</text>
  <text x="54" y="184" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#625b54">CIC-DDoS2019 · filtered 12-class holdout · 14,400 flows · class-aware evaluation</text>

  <g font-family="Arial,Helvetica,sans-serif">
    <rect x="52" y="230" width="230" height="150" rx="8" fill="#ffffff" stroke="#d9d2c7"/>
    <text x="70" y="258" font-family="'DejaVu Sans Mono','SFMono-Regular',Consolas,monospace" font-size="10" letter-spacing="1.2" fill="#8d1f2d">01 / INPUT</text>
    <text x="70" y="288" font-size="18" font-weight="700" fill="#1d1a17">Flow records</text>
    <text x="70" y="315" font-size="13" fill="#625b54">labelled traffic</text>
    <text x="70" y="336" font-size="13" fill="#625b54">balanced holdout</text>
    <text x="70" y="357" font-size="13" fill="#625b54">preprocessing pipeline</text>

    <rect x="312" y="230" width="250" height="150" rx="8" fill="#ffffff" stroke="#d9d2c7"/>
    <text x="330" y="258" font-family="'DejaVu Sans Mono','SFMono-Regular',Consolas,monospace" font-size="10" letter-spacing="1.2" fill="#8d1f2d">02 / MODEL</text>
    <text x="330" y="288" font-size="18" font-weight="700" fill="#1d1a17">Transformer variants</text>
    <text x="330" y="315" font-size="13" fill="#625b54">attention over flows</text>
    <text x="330" y="336" font-size="13" fill="#625b54">multiple encodings</text>
    <text x="330" y="357" font-size="13" fill="#625b54">reproducible training code</text>

    <rect x="592" y="230" width="230" height="150" rx="8" fill="#ffffff" stroke="#d9d2c7"/>
    <text x="610" y="258" font-family="'DejaVu Sans Mono','SFMono-Regular',Consolas,monospace" font-size="10" letter-spacing="1.2" fill="#8d1f2d">03 / OUTPUT</text>
    <text x="610" y="288" font-size="18" font-weight="700" fill="#1d1a17">12 classes</text>
    <text x="610" y="315" font-size="13" fill="#625b54">DDoS families</text>
    <text x="610" y="336" font-size="13" fill="#625b54">plus benign traffic</text>
    <text x="610" y="357" font-size="13" fill="#625b54">per-class scores</text>

    <rect x="852" y="230" width="296" height="150" rx="8" fill="#f4e6e5" stroke="#8d1f2d"/>
    <text x="870" y="258" font-family="'DejaVu Sans Mono','SFMono-Regular',Consolas,monospace" font-size="10" letter-spacing="1.2" fill="#8d1f2d">04 / CHECK</text>
    <text x="870" y="288" font-size="18" font-weight="700" fill="#1d1a17">Read the matrix</text>
    <text x="870" y="315" font-size="13" fill="#625b54">aggregate accuracy is not enough</text>
    <text x="870" y="336" font-size="13" fill="#625b54">inspect every class</text>
    <text x="870" y="357" font-size="13" fill="#625b54">document the weak spots</text>
  </g>

  <g stroke="#8d1f2d" stroke-width="1.8">
    <line x1="282" y1="305" x2="308" y2="305" marker-end="url(#ddos-arrow)"/>
    <line x1="562" y1="305" x2="588" y2="305" marker-end="url(#ddos-arrow)"/>
    <line x1="822" y1="305" x2="848" y2="305" marker-end="url(#ddos-arrow)"/>
  </g>

  <rect x="52" y="430" width="1096" height="132" rx="8" fill="#ffffff" stroke="#d9d2c7"/>
  <text x="74" y="462" font-family="'DejaVu Sans Mono','SFMono-Regular',Consolas,monospace" font-size="11" letter-spacing="1.5" fill="#625b54">FILTERED 12-CLASS HOLDOUT</text>
  <text x="74" y="526" font-family="Georgia,'Times New Roman',serif" font-size="48" font-weight="700" fill="#1d1a17">95.26%</text>
  <text x="255" y="524" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#625b54">accuracy</text>
  <text x="394" y="526" font-family="Georgia,'Times New Roman',serif" font-size="40" font-weight="700" fill="#1d1a17">0.95</text>
  <text x="485" y="524" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#625b54">macro-F1</text>
  <text x="1124" y="466" text-anchor="end" font-family="'DejaVu Sans Mono','SFMono-Regular',Consolas,monospace" font-size="11" letter-spacing="1.4" fill="#8d1f2d">WEAKEST CLASS</text>
  <text x="1124" y="526" text-anchor="end" font-family="Georgia,'Times New Roman',serif" font-size="40" font-weight="700" fill="#8d1f2d">0.65 recall</text>
  <text x="1124" y="548" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#625b54">NetBIOS</text>

  <text x="54" y="600" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#625b54">Repository evidence includes the confusion matrix and interpretability code. Results describe one filtered holdout, not a production benchmark.</text>
</svg>
