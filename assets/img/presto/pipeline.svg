<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="900" viewBox="0 0 1460 900">
<rect width="1460" height="900" fill="#ffffff"/>
<text x="48" y="42" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="15" fill="#1d4ed8" letter-spacing="1.5">PRESTO · SYSTEM ARCHITECTURE</text>
<text x="48" y="86" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#0f172a">End-to-end Arabic retrieval pipeline</text>
<text x="48" y="120" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="18" fill="#5b6b7c">29,014 queries → top-10 product IDs from a 107,041-product catalog · graded nDCG@10</text>
<line x1="48" y1="140" x2="1412" y2="140" stroke="#c9d6e3" stroke-width="1"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
</marker>
</defs>
<text x="34" y="180" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="start">1 · NORMALISE</text>
<text x="34" y="200" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" fill="#5b6b7c">Query → cleaned Arabic</text>
<text x="324" y="180" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="start">2 · RETRIEVE</text>
<text x="324" y="200" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" fill="#5b6b7c">Dense + lexical lanes</text>
<text x="654" y="180" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="start">3 · FUSE</text>
<text x="654" y="200" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" fill="#5b6b7c">DBSF, top-5,000</text>
<text x="934" y="180" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="start">4 · RERANK</text>
<text x="934" y="200" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" fill="#5b6b7c">Token-level MaxSim</text>
<text x="1284" y="180" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="start">5 · SUBMIT</text>
<text x="1284" y="200" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" fill="#5b6b7c">Top-10 CSV</text>
<rect x="30" y="220" width="260" height="380" rx="8" fill="#f6f9fc" stroke="#c9d6e3" stroke-width="1.4"/>
<text x="46" y="254" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">ArabicNormalizer</text>
<text x="46" y="282" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="15" fill="#0f172a">query: كابل شحن 3 امبير</text>
<text x="46" y="316" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" fill="#5b6b7c">• alef / yaa / taa unify</text>
<text x="46" y="338" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" fill="#5b6b7c">• tashkeel stripped</text>
<text x="46" y="360" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" fill="#5b6b7c">• tatweel stripped</text>
<text x="46" y="382" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" fill="#5b6b7c">• Arabic-Indic digits</text>
<text x="46" y="404" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" fill="#5b6b7c">• dash variants</text>
<text x="46" y="426" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" fill="#5b6b7c">• punctuation removed</text>
<text x="46" y="448" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" fill="#5b6b7c">• definite-article prefixes</text>
<text x="46" y="470" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" fill="#5b6b7c">• ZWS &amp; bidi marks</text>
<text x="46" y="492" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" fill="#5b6b7c">• lowercase Latin</text>
<text x="46" y="514" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" fill="#5b6b7c">• whitespace collapse</text>
<text x="46" y="584" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="12" fill="#0f766e">same code at index &amp; query time</text>
<rect x="320" y="220" width="300" height="380" rx="8" fill="#f6f9fc" stroke="#c9d6e3" stroke-width="1.4"/>
<text x="336" y="254" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Dense · Qwen3-0.6B</text>
<text x="336" y="278" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" fill="#5b6b7c">prestoai baseline + LoRA</text>
<text x="336" y="298" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" fill="#5b6b7c">LoRA r=16 · 1,024-d embeddings</text>
<rect x="336" y="312" width="268" height="78" rx="8" fill="#ffffff" stroke="#c9d6e3" stroke-width="1.4"/>
<text x="348" y="340" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#0f172a" text-anchor="start">cosine top-k</text>
<text x="348" y="364" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="12" fill="#5b6b7c">107,041 products in the dense index</text>
<rect x="336" y="406" width="268" height="70" rx="8" fill="#ffffff" stroke="#c9d6e3" stroke-width="1.4"/>
<text x="348" y="434" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#0f172a" text-anchor="start">Lexical · BM25</text>
<text x="348" y="458" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="12" fill="#5b6b7c">rank-bm25 over normalised names</text>
<rect x="336" y="492" width="268" height="70" rx="8" fill="#ffffff" stroke="#c9d6e3" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="348" y="520" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#5b6b7c" text-anchor="start">BGE-M3 sparse (explored)</text>
<text x="348" y="544" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="12" fill="#5b6b7c">LoRA r=16 · custom triplet 0.2</text>
<rect x="650" y="220" width="250" height="380" rx="8" fill="#f6f9fc" stroke="#c9d6e3" stroke-width="1.4"/>
<text x="666" y="254" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">DBSF fusion</text>
<text x="666" y="286" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" fill="#5b6b7c">min-max each signal,</text>
<text x="666" y="306" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" fill="#5b6b7c">then weighted sum</text>
<rect x="666" y="326" width="218" height="96" rx="8" fill="#ffffff" stroke="#c9d6e3" stroke-width="1.4"/>
<text x="678" y="356" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="14" font-weight="600" fill="#0f172a" text-anchor="start">0.4 × dense</text>
<text x="678" y="380" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="14" font-weight="600" fill="#0f172a" text-anchor="start">0.6 × BM25</text>
<text x="678" y="408" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="11" fill="#5b6b7c">best-run weights</text>
<text x="666" y="448" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="14" fill="#0f766e">top-5,000 candidates</text>
<text x="666" y="470" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="12" fill="#5b6b7c">wide pool before rerank</text>
<text x="666" y="512" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="12" fill="#5b6b7c">RRF / weighted / dense-only</text>
<text x="666" y="532" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="12" fill="#5b6b7c">variants benchmarked too</text>
<text x="666" y="584" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="11" fill="#5b6b7c">scores not comparable across signals</text>
<rect x="930" y="220" width="320" height="380" rx="8" fill="#f6f9fc" stroke="#c9d6e3" stroke-width="1.4"/>
<text x="946" y="254" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">Qwen3 ColBERT MaxSim</text>
<text x="946" y="282" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" fill="#5b6b7c">built from scratch in PyTorch</text>
<rect x="946" y="300" width="288" height="104" rx="8" fill="#ffffff" stroke="#c9d6e3" stroke-width="1.4"/>
<text x="958" y="328" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#0f172a" text-anchor="start">65,759 unique catalog texts</text>
<text x="958" y="350" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="12" fill="#5b6b7c">token cache ≈ 2 GB in fp16</text>
<text x="958" y="372" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="12" fill="#5b6b7c">special tokens masked</text>
<text x="958" y="394" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" font-weight="500" fill="#5b6b7c" text-anchor="start">chunk 500 → einsum qd,ntd→nqt</text>
<text x="946" y="432" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" fill="#0f172a">score = 0.5·ColBERT + 0.5·hybrid</text>
<text x="946" y="454" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="12" fill="#5b6b7c">per-query max over doc tokens</text>
<text x="946" y="496" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="12" fill="#0f766e">catalog encoded once (~3 min), reused</text>
<text x="946" y="518" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="11" fill="#5b6b7c">every query is one einsum over candidates</text>
<text x="946" y="584" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="12" fill="#5b6b7c">top-10 by blended score</text>
<rect x="1280" y="220" width="150" height="380" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.4"/>
<text x="1296" y="254" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#047857" text-anchor="start">Top-10</text>
<text x="1296" y="284" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" fill="#5b6b7c">29,014 rows</text>
<text x="1296" y="306" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="12" fill="#5b6b7c">query_id →</text>
<text x="1296" y="326" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" font-weight="500" fill="#5b6b7c" text-anchor="start">P_… P_… P_…</text>
<text x="1296" y="370" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" fill="#5b6b7c">nDCG@10</text>
<text x="1296" y="402" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#047857" text-anchor="start">0.62773</text>
<text x="1296" y="430" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" fill="#5b6b7c">#11 / 50+</text>
<text x="1296" y="470" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="12" fill="#5b6b7c">top-3 cut</text>
<text x="1296" y="494" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#b91c1c" text-anchor="start">0.69362</text>
