<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
<rect width="1400" height="760" fill="#ffffff"/>
<text x="48" y="42" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="15" fill="#1d4ed8" letter-spacing="1.5">PRESTO · ROOT-CAUSE ANALYSIS</text>
<text x="48" y="86" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#0f172a">The 90.8% distribution gap</text>
<text x="48" y="120" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="18" fill="#5b6b7c">Training positives were rich documents; the catalog at inference is name + category only</text>
<line x1="48" y1="140" x2="1352" y2="140" stroke="#c9d6e3" stroke-width="1"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
</marker>
</defs>
<rect x="40" y="170" width="640" height="300" rx="8" fill="#f6f9fc" stroke="#c9d6e3" stroke-width="1.4"/>
<text x="60" y="206" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">Training positive — rich document</text>
<text x="60" y="232" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" fill="#5b6b7c">Four fields concatenated with “ | ”</text>
<rect x="60" y="252" width="54" height="30" rx="15" fill="#e0ecff" stroke="#93b4f5"/>
<text x="70" y="272" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="start">name</text>
<rect x="150" y="252" width="78" height="30" rx="15" fill="#e0ecff" stroke="#93b4f5"/>
<text x="160" y="272" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="start">brand</text>
<rect x="240" y="252" width="102" height="30" rx="15" fill="#e0ecff" stroke="#93b4f5"/>
<text x="250" y="272" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="start">categories</text>
<rect x="370" y="252" width="120" height="30" rx="15" fill="#e0ecff" stroke="#93b4f5"/>
<text x="380" y="272" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="start">description</text>
<text x="60" y="320" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="15" fill="#0f172a">“micro USB charger | mobiles &amp; accessories | Boxu |</text>
<text x="60" y="344" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="15" fill="#0f172a">1 m braided fast-charge cable, 2.4 A …”</text>
<text x="60" y="392" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="14" fill="#5b6b7c">Long, descriptive, brand- and category-rich text.</text>
<text x="60" y="416" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="14" fill="#5b6b7c">What the embedding model is trained to match.</text>
<text x="60" y="452" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#0f766e" text-anchor="start">4 fields</text>
<rect x="720" y="170" width="640" height="300" rx="8" fill="#f6f9fc" stroke="#c9d6e3" stroke-width="1.4"/>
<text x="740" y="206" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">Inference catalog row — short text</text>
<text x="740" y="232" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" fill="#5b6b7c">Two columns: name + category</text>
<rect x="740" y="252" width="120" height="30" rx="15" fill="#dcfce7" stroke="#86efac"/>
<text x="750" y="272" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#047857" text-anchor="start">name</text>
<rect x="876" y="252" width="140" height="30" rx="15" fill="#dcfce7" stroke="#86efac"/>
<text x="886" y="272" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#047857" text-anchor="start">category</text>
<text x="740" y="320" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="15" fill="#0f172a">“micro charger 2.4 A - Boxu | charging cables”</text>
<text x="740" y="368" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="14" fill="#5b6b7c">No brand field, no description, no marketing copy.</text>
<text x="740" y="392" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="14" fill="#5b6b7c">A different length, tone and vocabulary.</text>
<text x="740" y="452" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#b45309" text-anchor="start">2 fields</text>
<line x1="690" y1="320" x2="714" y2="320" stroke="#b45309" stroke-width="2.4" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
<text x="40" y="540" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="64" font-weight="700" fill="#b91c1c" text-anchor="start">90.8%</text>
<text x="40" y="574" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="16" fill="#0f172a">of training positives have no exact match in the catalog</text>
<rect x="40" y="600" width="1198" height="44" fill="#fef3c7" stroke="#f59e0b"/>
<rect x="1238" y="600" width="122" height="44" fill="#dcfce7" stroke="#22c55e"/>
<text x="58" y="629" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#b45309" text-anchor="start">90.8% off-distribution</text>
<text x="1248" y="629" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#047857" text-anchor="start">9.2%</text>
<text x="1360" y="590" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#047857" text-anchor="end">9.2% on-distribution</text>
<text x="40" y="684" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" fill="#5b6b7c">The model learned to match queries against text it would never see at inference. The team diagnosed this on day 1–2 but never shipped catalog-text augmentation;</text>
<text x="40" y="708" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" fill="#5b6b7c">the post-mortem estimates +0.03–0.05 nDCG@10 was left on the table. A separate ceiling: 54% of catalog names are duplicates, so a correct product can share a name with</text>
<text x="40" y="732" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" fill="#5b6b7c">an ungraded clone — returning the wrong clone earns zero and cannot be fixed from the submission side.</text>
</svg>