<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
<rect width="1400" height="800" fill="#ffffff"/>
<text x="48" y="42" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="15" fill="#1d4ed8" letter-spacing="1.5">PRESTO · TRAINING</text>
<text x="48" y="86" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#0f172a">Two adapters that shipped, one rerun that didn’t</text>
<text x="48" y="120" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="18" fill="#5b6b7c">Qwen3-0.6B + LoRA · one trained on expanded triplets, one on catalog-matched triplets</text>
<line x1="48" y1="140" x2="1352" y2="140" stroke="#c9d6e3" stroke-width="1"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
</marker>
</defs>
<rect x="40" y="180" width="400" height="300" rx="8" fill="#f6f9fc" stroke="#c9d6e3" stroke-width="1.4"/>
<text x="64" y="216" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#047857" text-anchor="start">SHIPPED · DENSE</text>
<text x="64" y="244" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="14" fill="#0f172a">531k expanded triplets</text>
<text x="64" y="282" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" fill="#5b6b7c">• hard-negative expansion from 125,517 raw</text>
<text x="64" y="308" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" fill="#5b6b7c">• LoRA r=16 · batch 64</text>
<text x="64" y="334" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" fill="#5b6b7c">• MultipleNegativesRankingLoss</text>
<text x="64" y="360" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" fill="#5b6b7c">• used by every submission</text>
<rect x="64" y="404" width="352" height="40" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
<text x="78" y="430" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#047857" text-anchor="start">155501 · dense retrieval</text>
<line x1="440" y1="330" x2="478" y2="330" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="480" y="180" width="400" height="300" rx="8" fill="#f6f9fc" stroke="#c9d6e3" stroke-width="1.4"/>
<text x="504" y="216" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#047857" text-anchor="start">SHIPPED · COLBERT</text>
<text x="504" y="244" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="14" fill="#0f172a">125k catalog-matched triplets</text>
<text x="504" y="282" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" fill="#5b6b7c">• train text aligned to inference catalog</text>
<text x="504" y="308" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" fill="#5b6b7c">• batch 64 · 5,563 steps · 1h 12m</text>
<text x="504" y="334" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" fill="#5b6b7c">• final loss 0.122</text>
<text x="504" y="360" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" fill="#5b6b7c">• same adapter also drives token-level rerank</text>
<rect x="504" y="404" width="352" height="40" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
<text x="518" y="430" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#047857" text-anchor="start">010417 · reranker → 0.62773</text>
<line x1="880" y1="330" x2="918" y2="330" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="920" y="180" width="400" height="300" rx="8" fill="#ffffff" stroke="#c9d6e3" stroke-width="1.4" stroke-dasharray="6 5"/>
<text x="944" y="216" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#b45309" text-anchor="start">ATTEMPTED · UNIFIED</text>
<text x="944" y="244" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="14" fill="#0f172a">125k positive pairs → triplets</text>
<text x="944" y="282" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" fill="#5b6b7c">• Phase 1: CosineSimilarityLoss · 2 epochs</text>
<text x="944" y="308" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" fill="#5b6b7c">• Phase 2: MNRL · batch 32 · 2 epochs</text>
<text x="944" y="334" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" fill="#5b6b7c">• loss 0.848 → 0.300</text>
<text x="944" y="360" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" fill="#5b6b7c">• eval still running at deadline</text>
<rect x="944" y="404" width="352" height="40" rx="6" fill="#fffbeb" stroke="#fde68a"/>
<text x="958" y="430" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#b45309" text-anchor="start">never evaluated</text>
<rect x="40" y="520" width="1320" height="170" rx="8" fill="#f6f9fc" stroke="#c9d6e3" stroke-width="1.4"/>
<text x="60" y="556" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">What the two shipped runs shared</text>
<text x="60" y="586" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" fill="#5b6b7c">Base: prestoai/qwen3-embedding-0.6b-arabic-ecom · fully normalised Arabic text on both sides · LoRA r=16 · fp16 · batch 64</text>
<text x="60" y="610" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" fill="#5b6b7c">Training data: 125,517 raw query/positive/negative triplets → 531k expanded via hard-negative mining → 125k catalog-matched for the reranker stage</text>
<text x="60" y="634" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" fill="#5b6b7c">Serving: the dense adapter retrieves 5,000 candidates; the catalog-matched adapter scores them token-by-token with MaxSim and blends 50/50 with the hybrid score.</text>
<text x="60" y="664" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="12" fill="#0f766e">The repo’s current config defaults to r=32 / α=64 and caps stage 2 at 115k samples — post-competition retraining settings, not the submitted checkpoints.</text>
<text x="40" y="730" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="12" fill="#5b6b7c">Unfinished rerun: a unified two-phase experiment (positive pairs, then triplets) reached loss 0.300 but its evaluation projected 8+ hours on the RTX 3050; the competition ended first.</text>
<text x="40" y="752" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="12" fill="#5b6b7c">A Phase-1 checkpoint was also lost to an ephemeral Colab path and had to be retrained. The shipped 0.62773 stands on the two adapters above.</text>
</svg>