<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="1164px" preserveAspectRatio="none" style="width:762px;height:1164px;background:#FFFFFF;" version="1.1" viewBox="0 0 762 1164" width="762px" zoomAndPan="magnify"><title>MC14 system landscape: ownership and integration contracts</title><defs/><g><g class="title" data-source-line="20"><text fill="#000000" font-family="'Liberation Sans','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="20" font-weight="bold" lengthAdjust="spacing" textLength="589.0332" x="83.2334" y="28.7598">MC14 system landscape: ownership and integration contracts</text></g><!--entity browser--><g class="entity" data-qualified-name="browser" data-source-line="22" id="ent0002"><rect fill="#E8F6F3" height="117.7417" rx="5" ry="5" style="stroke:#3478C0;stroke-width:0.5;" width="300.1846" x="77.5" y="55.998"/><text fill="#000000" font-family="'Liberation Sans','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" lengthAdjust="spacing" textLength="151.1406" x="87.5" y="81.9438">Browser / portal UI</text><text fill="#000000" font-family="'Liberation Sans','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="17" lengthAdjust="spacing" textLength="221.1328" x="87.5" y="101.4922">Chat and streamed rendering</text><text fill="#000000" font-family="'Liberation Sans','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="17" lengthAdjust="spacing" textLength="280.1846" x="87.5" y="121.0405">Current page + role/text conversation</text><text fill="#000000" font-family="'Liberation Sans','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="17" lengthAdjust="spacing" textLength="257.9717" x="87.5" y="140.5889">PDF upload and active workspace</text><text fill="#000000" font-family="'Liberation Sans','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="17" lengthAdjust="spacing" textLength="228.6865" x="87.5