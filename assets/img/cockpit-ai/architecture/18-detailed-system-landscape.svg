="30" id="ent0006"><rect fill="#FFF5DF" height="156.8384" rx="5" ry="5" style="stroke:#3478C0;stroke-width:0.5;" width="359.2197" x="7" y="906.998"/><text fill="#000000" font-family="'Liberation Sans','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" lengthAdjust="spacing" textLength="323.0996" x="17" y="932.9438">Independent evidence / metadata stores</text><text fill="#000000" font-family="'Liberation Sans','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="17" lengthAdjust="spacing" textLength="339.2197" x="17" y="952.4922">Elasticsearch: customer and collection scope</text><text fill="#000000" font-family="'Liberation Sans','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="17" lengthAdjust="spacing" textLength="298.6289" x="17" y="972.0405">Qdrant: node points and named vectors</text><text fill="#000000" font-family="'Liberation Sans','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="17" lengthAdjust="spacing" textLength="232.4634" x="17" y="991.5889">Qdrant: attribute / chunk points</text><text fill="#000000" font-family="'Liberation Sans','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="17" lengthAdjust="spacing" textLength="327.4575" x="17" y="1011.1372">Qdrant: document chunks + page metadata</text><text fill="#000000" font-family="'Liberation Sans','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="17" lengthAdjust="spacing" textLength="247.5791" x="17" y="1030.6855">Source IDs and access payloads</text><text fill="#000000" font-family="'Liberation Sans','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="17" lengthAdjust="spacing" textLength="267.4429" x="17" y="1050.2339">Not a saved-conversation database</text></g><!--entity local--><g class="entity" data-qualified-name="local" data-source-line="32" id="ent0007"><rect fill="#E8F6F3" height="156.8384" rx="5" ry="5" style="stroke:#3478C0;stroke-width:0.5;" width="372.4346" x="384.5" y="906.998"/><text fill="#000000" font-family="'Liberation Sans