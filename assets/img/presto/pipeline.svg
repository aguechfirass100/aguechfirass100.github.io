<rect x="30" y="650" width="1400" height="130" rx="8" fill="#ffffff" stroke="#c9d6e3" stroke-width="1.4"/>
<text x="48" y="686" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Catalog &amp; index</text>
<text x="48" y="714" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="14" fill="#5b6b7c">107,041 products · name + category text only · 54% of names are duplicates → shared IDs cap achievable nDCG</text>
<text x="48" y="740" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="14" fill="#5b6b7c">Index: Qdrant hybrid collection (dense + sparse) · deterministic UUIDv5 point IDs · best run used batched torch matmul + topk over the full matrix</text>
<text x="48" y="766" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="14" fill="#0f766e">Retrieval speed: naive per-query Qdrant loop projected 9+ hours → batched torch ≈ 2 minutes for all 29k queries</text>
<text x="48" y="830" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" fill="#5b6b7c">Artifacts: public repository (src/, configs, notes) · competition: PrestoAI Arabic E-Commerce Search &amp; Retrieval Challenge (Kaggle, 2026) · built in 8 nights on an RTX 3050 4 GB, then a rented A100 40 GB</text>
