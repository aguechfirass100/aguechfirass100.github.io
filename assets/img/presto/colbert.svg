<text x="222" y="198" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#5b6b7c" text-anchor="end">query tokens</text>
<rect x="840" y="230" width="500" height="300" rx="8" fill="#f6f9fc" stroke="#c9d6e3" stroke-width="1.4"/>
<text x="864" y="268" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#0f172a" text-anchor="start">score = Σᵢ maxⱼ qᵢ · dⱼ</text>
<text x="864" y="306" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="14" fill="#5b6b7c">For each query token, take the best dot product</text>
<text x="864" y="328" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="14" fill="#5b6b7c">against any document token, then sum.</text>
<text x="864" y="366" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">Implementation details</text>
<text x="864" y="394" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" fill="#5b6b7c">• special tokens ([CLS], [SEP], [PAD]) masked out</text>
<text x="864" y="418" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" fill="#5b6b7c">• documents padded to the chunk max; pad set to -∞</text>
<text x="864" y="442" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" fill="#5b6b7c">• chunk size 500 candidates to bound GPU memory</text>
<text x="864" y="466" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" fill="#5b6b7c">• einsum('qd,ntd->nqt') then max over tokens</text>
<text x="864" y="490" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" fill="#5b6b7c">• catalog pre-encoded once, reused for every query</text>
<rect x="840" y="560" width="500" height="110" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.4"/>
<text x="864" y="594" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#047857" text-anchor="start">Blend with the hybrid score</text>
<text x="864" y="622" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" fill="#0f172a">0.5 × min-max(ColBERT) + 0.5 × min-max(hybrid)</text>
<text x="864" y="648" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="12" fill="#5b6b7c">50/50 was the best of the tested blends.</text>
<text x="40" y="620" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="15" fill="#0f172a">Why not a cross-encoder:</text>
<text x="40" y="646" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" fill="#5b6b7c">29k queries × 5,000 candidates would mean ~145M forward passes.</text>
<text x="40" y="670" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" fill="#5b6b7c">ColBERT pays the encoding cost once (catalog), then each query</text>
<text x="40" y="694" font-family="'Inter','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="13" fill="#5b6b7c">is a single einsum against cached token matrices.</text>
</svg>