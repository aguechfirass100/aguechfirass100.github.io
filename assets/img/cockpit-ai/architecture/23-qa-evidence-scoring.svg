<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="787px" preserveAspectRatio="none" style="width:575px;height:787px;background:#FFFFFF;" version="1.1" viewBox="0 0 575 787" width="575px" zoomAndPan="magnify"><title>Chatbot answer evaluation</title><defs/><g><g class="title" data-source-line="28"><text fill="#000000" font-family="'Liberation Sans','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="229.043" x="171.7871" y="36.8838">Chatbot answer evaluation</text></g><ellipse cx="302.7207" cy="61.6982" fill="#008C95" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F0F6FC" height="56.7969" rx="12.5" ry="12.5" style="stroke:#3478C0;stroke-width:0.5;" width="319.7344" x="142.8535" y="91.6982"/><text fill="#000000" font-family="'Liberation Sans','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="16" lengthAdjust="spacing" textLength="166.3359" x="152.8535" y="116.7061">Select dataset question</text><text fill="#000000" font-family="'Liberation Sans','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="16" lengthAdjust="spacing" textLength="299.7344" x="152.8535" y="135.1045">Keep reference answer for evaluation only</text><rect fill="#E8F6F3" height="38.3984" rx="12.5" ry="12.5" style="stroke:#3478C0;stroke-width:0.5;" width="297.5469" x="153.9473" y="168.4951"/><text fill="#000000" font-family="'Liberation Sans','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="16" lengthAdjust="spacing" textLength="277.5469" x="163.9473" y="193.5029">Send question to authenticated chatbot</text><rect fill="#F0F6FC" height="38.3984" rx="12.5" ry="12.5" style="stroke:#3478C0;stroke-width:0.5;" width="304.6172" x="150.4121" y="226.8936"/><text fill="#000000" font-family="'Liberation Sans','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="16" lengthAdjust="spacing" textLe