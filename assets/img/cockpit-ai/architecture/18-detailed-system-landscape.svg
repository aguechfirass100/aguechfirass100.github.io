="spacing" textLength="222.9839" x="227.5" y="255.9438">MediaCockpit Java process</text><text fill="#000000" font-family="'Liberation Sans','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="17" lengthAdjust="spacing" textLength="311.8521" x="227.5" y="275.4922">Request API / SSE / attachment endpoint</text><text fill="#000000" font-family="'Liberation Sans','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="17" lengthAdjust="spacing" textLength="302.3809" x="227.5" y="295.0405">Server user, locale and principal context</text><text fill="#000000" font-family="'Liberation Sans','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="17" lengthAdjust="spacing" textLength="297.6826" x="227.5" y="314.5889">LangGraph4j: reason -&gt; tools -&gt; reason</text><text fill="#000000" font-family="'Liberation Sans','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="17" lengthAdjust="spacing" textLength="309.9761" x="227.5" y="334.1372">Typed catalogue and Java tool executors</text><text fill="#000000" font-family="'Liberation Sans','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="17" lengthAdjust="spacing" textLength="282.5171" x="227.5" y="353.6855">Existing entity/search/edit/report APIs</text><text fill="#000000" font-family="'Liberation Sans','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="17" lengthAdjust="spacing" textLength="284.418" x="227.5" y="373.2339">Session: role/text history, page, drafts</text><text fill="#000000" font-family="'Liberation Sans','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="17" lengthAdjust="spacing" textLength="261.7402" x="227.5" y="392.7822">RAM: checkpoints and client reuse</text></g><!--entity rag--><g class="entity" data-qualified-name="rag" data-source-line="28" id="ent0005"><rect fill="#F0F6FC" height="195.9351" rx="5" ry="5" style="stroke:#3478C0;stroke-width:0.5;" width="338.8994" x="115" y="654.998"/><text fill="#000000" font-family="'Liberation Sans','Helvetica Neue',Arial,Helvetica,sans-serif" 