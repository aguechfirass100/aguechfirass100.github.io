rial,Helvetica,sans-serif" font-size="14" lengthAdjust="spacing" textLength="167.3232" x="200.5" y="439.1299">portal model / optional web</text></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0003" data-link-type="dependency" id="lnk17"><polygon fill="#3478C0" points="168.1762,599.246,165.1953,608.6328,168.7287,604.2153,173.1463,607.7488,168.1762,599.246" style="stroke:#3478C0;stroke-width:1;"/><path d="M186.5406,654.6442 C183.1453,648.8987 180.0958,643.0063 177.5,636.998 C172.4403,625.2867 170.2749,618.1218 168.8392,605.2092" fill="none" style="stroke:#3478C0;stroke-width:1;"/><text fill="#000000" font-family="'Liberation Sans','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="14" lengthAdjust="spacing" textLength="188.3301" x="179.5" y="632.1299">document text / optional vision</text></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" data-link-type="dependency" id="lnk18"><polygon fill="#3478C0" points="179.8671,906.7406,184.5227,898.0616,180.2374,901.7543,176.5447,897.469,179.8671,906.7406" style="stroke:#3478C0;stroke-width:1;"/><path d="M195.4473,851.318 C192.4078,857.0916 189.7224,862.9972 187.5,868.998 C183.1126,880.845 181.2685,887.8725 180.3115,900.7571" fill="none" style="stroke:#3478C0;stroke-width:1;"/><text fill="#000000" font-family="'Liberation Sans','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="14" lengthAdjust="spacing" textLength="196.1162" x="189.5" y="884.1299">tenant-scoped queries / upserts</text></g><g class="legend" data-source-line="46"><rect fill="none" height="74.3945" rx="5" ry="5" style="stroke:#000000;stroke-width:1;" width="553.915" x="100.7925" y="1069.998"/><text fill="#000000" font-family="'Liberation Sans','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="14" lengthAdjust="spacing" textLength="454.46" x="105.7925" y="1088.1299">The boxes show logical ownership, not a certification of network isolation.</text><text fill="#000000" font-family="'Liberation Sans','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="14" lengthAdjust="spacing" textLength="543.915" x="105.7925" y="1104.2285">Normal Save remains user-controlled; models do not receive arbitrary database access.</text><text fill="#000000" font-family="'Liberation Sans','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="14" lengthAdjust="spacing" textLength="538.5557" x="105.7925" y="1120.3271">The portal, catalogue embedding cache and graph checkpoints have different lifetimes.</text><text fill="#000000" font-family="'Liberation Sans','Helvetica Neue',Arial,Helvetica,sans-serif" font-size="14" lengthAdjust="spacing" textLength="449.0254" x="105.7925" y="1136.4258">Optional or unavailable paths are not newly runtime-verified integrations.</text></g></g></svg>