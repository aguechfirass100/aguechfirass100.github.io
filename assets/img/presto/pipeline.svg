<line x1="620" y1="410.0" x2="648" y2="410.0" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="900" y1="410.0" x2="928" y2="410.0" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#arrow)"/>
